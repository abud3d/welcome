<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="بداية جديدة، وأفكار تتحول إلى واقع.">
  <title>مرحباً بك | Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f4f7fb;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(ellipse at 50% 15%, #243b58 0, #101827 48%, #090e18 100%);
    }
    main { width: min(100%, 720px); text-align: center; padding: 64px 28px; }
    .mark { width: 58px; height: 4px; margin: 0 auto 30px; border-radius: 9px; background: #8bc5ff; }
    h1 { margin: 0; font-size: clamp(2.6rem, 8vw, 5rem); letter-spacing: -2px; }
    p { margin: 22px auto 0; max-width: 520px; color: #bac8d9; font-size: clamp(1.05rem, 3vw, 1.3rem); line-height: 2; }
    .date { display: inline-block; margin-top: 42px; padding: 10px 18px; border: 1px solid #ffffff24; border-radius: 999px; color: #d8e8f8; font-size: .95rem; }
    footer { margin-top: 58px; color: #718198; font-size: .82rem; direction: ltr; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>أهلاً بك</h1>
    <p>كل بداية تحمل فرصة جديدة.<br>هنا تبدأ الحكاية، والأفكار تتحول إلى واقع.</p>
    <div class="date">بداية المشروع · 31 أكتوبر 2026</div>
    <footer>WELCOME · 2026</footer>
  </main>
</body>
</html>
